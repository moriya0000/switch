<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>関鉄発車標 ver2.0</title>

    <link
        rel="shortcut icon"
        href="https://www.kantetsu.co.jp/cms/wp-content/themes/kr/img/favicon/favicon.ico"
    >

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- =========================================
         現在時刻
    ========================================== -->
    <header class="top">
        <div class="top__label">現在時刻</div>
        <div class="top__time" id="now">--:--</div>
    </header>
<!-- =========================================
         音声コントロール
    ========================================== -->
    <section class="audio-control" id="audioControl">

        <button
            type="button"
            id="enableAudioButton"
            class="audio-control__button"
        >
            🔊 音声を有効にする
        </button>

        <div
            id="audioStatus"
            class="audio-control__status"
        >
            iPadでは最初に1回タップしてください
        </div>

    </section>


    <!-- =========================================
         操作エリア
    ========================================== -->
    <section class="control-area">

        <div class="control-row">

            <label class="control-field">
                <span>列車番号：</span>
                <input
                    type="text"
                    id="delayTrainNo"
                    inputmode="numeric"
                    autocomplete="off"
                >
            </label>

            <label class="control-field">
                <span>遅延時間(分)：</span>
                <input
                    type="number"
                    id="delayMinutes"
                    min="0"
                    inputmode="numeric"
                >
            </label>

            <button type="button" id="addDelay">
                追加
            </button>

            <button type="button" id="mobileScreenButton">
                モバスクリーン
            </button>

        </div>


        <div class="control-row">

            <span>ダイヤ切替：</span>

            <button type="button" id="btnAuto">
                自動
            </button>

            <button type="button" id="btnWeekday">
                平日
            </button>

            <button type="button" id="btnHoliday">
                休日
            </button>

            <span id="timetableStatus"></span>

        </div>

    </section>


    <!-- =========================================
         発車標
    ========================================== -->
    <main class="board" id="board"></main>


    

    <!-- =========================================
         音声デバッグ
    
    <section
        id="audioDebug"
        class="audio-debug"
    >
        音声デバッグ初期化中...
    </section>
    ========================================== -->

    <!-- =========================================
         スイッチ操作
    ========================================== -->
    <section class="switch-page">

        <div class="switch-container">

            <!-- 上り -->
            <div
                class="switch"
                id="nobori"
                data-direction="up"
            >

                <img
                    class="switch-image"
                    src="png/下り.png"
                    alt="上りスイッチ"
                    draggable="false"
                >

                <button
                    type="button"
                    class="on-button"
                    aria-label="上り ON"
                >
                    ON
                </button>

                <button
                    type="button"
                    class="off-button"
                    aria-label="上り OFF"
                >
                    OFF
                </button>

                <div class="status">
                    OFF
                </div>

            </div>


            <!-- 下り -->
            <div
                class="switch"
                id="kudari"
                data-direction="down"
            >

                <img
                    class="switch-image"
                    src="png/上り.png"
                    alt="下りスイッチ"
                    draggable="false"
                >

                <button
                    type="button"
                    class="on-button"
                    aria-label="下り ON"
                >
                    ON
                </button>

                <button
                    type="button"
                    class="off-button"
                    aria-label="下り OFF"
                >
                    OFF
                </button>

                <div class="status">
                    OFF
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
         データ
    ========================================== -->
    <script src="./js/timetable.js"></script>

    <!-- =========================================
         本体
    ========================================== -->
    <script src="./js/app.js"></script>

    <!-- =========================================
         音声
    ========================================== -->
    <script src="./js/audio.js"></script>

</body>
</html>
