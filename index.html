<style>
body {
  margin: 0;
  background: #fff;
  font-family: "JFドットjiskan24h", "MS ゴシック", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* 現在時刻 */
.top {
  width: 1200px;
  display: grid;
  grid-template-columns: 80px 580px 1fr 200px;
  align-items: start;
  padding: 18px 0 5px;
  font-family: "MS ゴシック";
  box-sizing: border-box;
  margin: 0 auto;
}
.top .label { font-size:16px; font-weight:bold; }
.top .time  { font-size:48px; font-weight:bold; text-align:left;}

/* 発車標 */
.board {
  display: grid;
  grid-template-columns: 625px;
  justify-content: center;
}
.board > div {
  width: 625px;
  background: #777;
  margin: 8px 0;
}
@media screen and (min-width: 1250px) {
  .board { grid-template-columns: 625px 625px; }
}

/* ブロック */
.block {
  background: #666;
  margin: 0;
  padding: 6px;
}

/* タイトル */
.block-title {
  display: grid;
  grid-template-columns: 70px 1fr 40px;
  align-items: center;
  color: #fff;
  font-size: 26px;
  font-family: "国鉄っぽいフォント（正体）";
  margin-bottom: 4px;
}

.block-title .no {
  border:3px solid #fff;
  width:35px;
  text-align:center;
}

/* 見出し */
.header {
  display: grid;
  grid-template-columns: 130px 240px 120px;
  font-size: 18px;
  font-family: "MS ゴシック";
  color: #fff;
  text-align: center;
  margin-bottom: 2px;
}

/* 表 */
.table {
  background: #3a3a3a;
  padding: 4px 0;
}
.row {
  display: grid;
  grid-template-columns: 130px 240px 118px;
  align-items: center;
  margin-bottom: 2px;
  height: 50px;
  }

/* 文字 */
.type  { color: #33cc33; font-size:46px; text-align:center; }
.dest  { color: #ffcc00; font-size:46px; text-align:center; }
.time2 { color: #33cc33; font-size:46px; text-align:right; position: relative;}
.cars  { color: #ffcc00; font-size:46px; text-align:center; }
.track { color: #33cc33; font-size:46px; text-align:center; }

.cars .suffix {
  font-size: 24px;
  position: relative;
  top: -2px;
  margin-left: 2px;
}

/* ===== 案内表示 ===== */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes scrollText {
  0%   { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}


/* 案内行（row互換） */
.row.arrival {
  grid-template-columns: 1fr;
  height: 50px;
}

.service-info iframe {
  width: 650px;
  height: 170px;
}
.row.arrival > div {
  grid-column: 1 / -1;
  width: 100%;
  font-size: 48px;
  text-align: center;
  color: #ff3333; /* 赤 */
  overflow: hidden;
  white-space: nowrap;
}


.row.arrival.scroll {
  position: relative;
  overflow: hidden;
}

.row.arrival.scroll span {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: scrollText 12s linear forwards;
  will-change: transform;
}


/* 点滅 */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}

.row.arrival.blink > div {
  animation: blink 1s steps(1) infinite;
}

.type.rapid {
  color: #ff3333; /* 赤 */
}


.next-trains {
  font-size: 24px;
  color: #333;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.time2 .delay {
  position: absolute;
  bottom: -20px;       /* 時刻の真ん中下寄り */
  left: 50%;
  transform: translateX(-50%);
  color: red;
  font-size: 23px;   /* 元の半分 */
 white-space: nowrap;
}

.station-sign {
  width: 400px;
  height: 120px;
  background: #fff;
  border: 4px solid #000;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: "国鉄っぽいフォント（正体）", "MS ゴシック", monospace;
}

.sign-main {
  font-size: 50px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.sign-sub {
  font-size: 42px;
  padding: 2px 24px;
  border-top: 2px solid #000;
}
.next-trains{
  font-size: 38px;
  margin-bottom: 6px;
  font-family: "国鉄っぽいフォント（正体）", "MS ゴシック", monospace;

}

/* ========================================
   スイッチ操作
======================================== */

.switch-page {
    width: 100%;
    padding: 50px 20px 80px;

    text-align: center;

    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    color: #333;
}

.switch-title {
    margin-bottom: 45px;

    font-size: 26px;
    font-weight: 600;

    letter-spacing: 0.12em;
}

.switch-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;

    gap: 55px;

    flex-wrap: wrap;
}
.switch {
    position: relative;

    width: 365px;
    height: 544px;

    transform: none;
    transition: none;
}

.switch:hover {
    transform: none;
}

.switch-image {
    display: block;

    width: 365px;
    height: 544px;

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: none;
}

/* ========================================
   ONボタン
======================================== */

.on-button {
    position: absolute;

    left: 150px;
    top: 225px;

    width: 71px;
    height: 71px;

    padding: 0;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    background: #050505;
    color: #eeeeee;

    font-family: Arial, sans-serif;
    font-size: 33px;
    font-weight: 300;

    display: flex;
    justify-content: center;
    align-items: center;

    transform: translateY(0);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        inset 0 -3px 4px rgba(0,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.8);

    transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;

    user-select: none;
}


/*
 * ON中は押し込まれた状態を維持
 */

.on-button.pressed {
    transform:
        translateY(2px)
        scale(0.96);

    box-shadow:
        inset 0 4px 6px rgba(0,0,0,0.9),
        inset 0 -1px 2px rgba(255,255,255,0.08),
        0 0 1px rgba(0,0,0,0.8);
}


/* ========================================
   OFFボタン
======================================== */

.off-button {
    position: absolute;

    left: 150px;
    top: 323px;

    width: 71px;
    height: 71px;

    padding: 0;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    background: #d40000;
    color: white;

    font-family: Arial, sans-serif;
    font-size: 31px;
    font-weight: 300;

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        inset 0 -3px 4px rgba(100,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.8);

    transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;

    user-select: none;
}


/*
 * OFFは押した瞬間だけ沈む
 */

.off-button:active {
    transform:
        translateY(-2px)
        scale(0.96);

    box-shadow:
        inset 0 4px 6px rgba(80,0,0,0.9),
        inset 0 -1px 2px rgba(255,255,255,0.08);
}


/* ========================================
   状態表示
======================================== */

.status {
    position: absolute;

    bottom: -42px;

    left: 50%;

    transform: translateX(-50%);

    min-width: 90px;

    padding: 6px 16px;

    text-align: center;

    border-radius: 15px;

    background: #eeeeee;

    color: #777;

    font-size: 13px;

    letter-spacing: 0.08em;

    border: 1px solid #dddddd;
}

.switch.is-on .status {
    color: #267a35;
    background: #eef8ef;
    border-color: #c8e5cc;
}


/* ========================================
   スマホ対応
======================================== */

@media (max-width: 1000px) {

    .switch-container {
        gap: 70px;
    }

}

@media (max-width: 520px) {

    .switch-page {
        padding: 30px 10px;

        margin-bottom: -130px;
    }

/* =========================================================
   iPad 横向き
   ========================================================= */

@media screen and
(min-width: 768px) and
(max-width: 1366px) and
(orientation: landscape) {

    .top {
        width: calc(100vw - 32px);
    }

    .board {
        width: 100%;
        max-width: 1280px;

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr);

        gap: 10px;

        padding: 0 10px;
    }

    .board > div {
        width: 100%;
        max-width: none;
        min-width: 0;
    }

    .header {
        grid-template-columns:
            22%
            40%
            38%;
    }

    .row {
        grid-template-columns:
            22%
            40%
            38%;
    }

    .type,
    .dest,
    .time2 {
        font-size: clamp(27px, 3.8vw, 42px);
    }

    .block-title {
        font-size: clamp(20px, 2.5vw, 26px);
    }

    .switch-container {
        flex-direction: row;
        flex-wrap: nowrap;

        gap: 20px;

        justify-content: center;
    }

    .switch {
        transform: scale(
            min(
                0.85,
                calc((100vw - 80px) / 760)
            )
        );

        transform-origin: top center;

        margin-bottom: -80px;
    }

    .switch:hover {
        transform: scale(
            min(
                0.85,
                calc((100vw - 80px) / 760)
            )
        );
    }
}

let trainsUp = [];
let trainsDown = [];
let currentDayType = "";

function loadTimetableByDayType(){
  const now = new Date();
  const week = now.getDay(); // 0=日
  const isWeekend = (week === 0 || week === 6);
  const isHoliday = isJapaneseHoliday(now);

  const dayType = (isWeekend || isHoliday) ? "holiday" : "weekday";

  // 同じ種別なら再読み込みしない
  if(currentDayType === dayType) return;

  currentDayType = dayType;

  if(dayType === "holiday"){
    trainsUp = parseCsv(csvUpHoliday);
    trainsDown = parseCsv(csvDownHoliday);
    console.log("休日ダイヤ読み込み");
  } else {
    trainsUp = parseCsv(csvUpWeekday);
    trainsDown = parseCsv(csvDownWeekday);
    console.log("平日ダイヤ読み込み");
  }

  updateBoard();
  updateNextTrains();
}
function updateNextTrains(){
    updateBoard();
}


function parseCsv(csv){
  return csv.trim().split('\n').map(line=>{
    const c = line.split(',');
    return {
      no: c[0],
      dest: c[1],
      track: c[2],
      time: c[3],
      type: c[4],
      trackno: c[5],
      cars: c[6],
      arrivalMin: Number(c[7] || 1)   // ←追加（未設定なら1分前）
    };
  });
}
setInterval(loadTimetableByDayType, 60 * 1000);


/* ===== 案内文生成（既存そのまま） ===== */
// 行先の空白を削除するユーティリティ
function normalizeDest(dest) {
  return dest.replace(/\s+/g, '');
}

// 上り列車用の案内文生成
function generateGuideMessageUp(train) {
  if (!train) return "";
  const dest = normalizeDest(train.dest);

  if (train.track === "乗") return `こんどの${dest}行きは水海道にて乗り換えとなります。`;
  if (train.track === "始") return `こんどの${dest}行きは当駅始発の列車です。`;
  if (train.track === "接") return `こんどの${dest}行きは水海道にて快速に接続いたします。`;

  if (train.cars === "1") return `こんどの${dest}行きは1両編成でまいります。`;
  if (train.type === "快速") return `終点取手まで各駅に停車いたします。`;

  if (train.no === "") return `本日の上り列車はすべて終了いたしました。`;

  return `こんどの${dest}行のご案内です`;
}

// 下り列車用の案内文生成
function generateGuideMessageDown(train) {
  if (!train) return "";
  const dest = normalizeDest(train.dest);

  if (train.track === "乗") return `こんどの${dest}行きは水海道にて乗り換えとなります。`;
  if (train.track === "始") return `こんどの${dest}行きは当駅始発の列車です。`;
  if (train.track === "接") return `こんどの${dest}行きは水海道にて快速に接続いたします。`;
  if (train.track === "快") return `こんどの${dest}行きは守谷にて快速に接続いたします。`;
  if (train.cars === "1") return `こんどの${dest}行きは1両編成でまいります。`;
  if (train.type === "快速") return `こんどの${dest}行きは快速列車です。停車駅にご注意ください。`;

  return `こんどの${dest}行のご案内です`;
}
/* ===== 判定 ===== */
const delays = {}; // 遅延情報 { "1002": 5 }

function getRemainingTime(train){
  if(!train) return Infinity;

  const now = new Date();
  const [h,m] = train.time.split(':').map(Number);

  // 発車時刻オブジェクト
  let dep = new Date(now);
  dep.setHours(h, m, 0, 0);

  // 遅延時間を加算
  const delay = delays[train.no] || 0;
  dep.setMinutes(dep.getMinutes() + delay);

  // 日付跨ぎ補正（4時基準）
  const nowH = now.getHours();
  if (h < 4 && nowH >= 4) {
    // 発車時刻が0-3時台で、現在時刻が4時以降なら翌日の列車
    dep.setDate(dep.getDate() + 1);
  } else if (h >= 4 && nowH < 4) {
    // 発車時刻が4時以降で、現在時刻が0-3時台の場合、前日の列車
    dep.setDate(dep.getDate() - 1);
  }

  return (dep - now)/1000; // 残り秒
}


function isArrivingSoon(train){
  if(!train) return false;

  const diffSec = getRemainingTime(train);

  // 表示開始時刻（分）
  const beforeSec = (train.arrivalMin || 1) * 60;

  // 表示開始から1分間だけ表示
  return diffSec <= beforeSec && diffSec > beforeSec - 60;
}


function getNextTrains(trains){
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  return trains.filter(t=>{
    const [h,m] = t.time.split(':').map(Number);
    const delay = delays[t.no] || 0;
    let trainMinutes = h*60 + m + delay;

    // 0時台～3:59は日付跨ぎとして加算24h
    if(h < 4 && now.getHours() >= 4){
      trainMinutes += 24*60;
    }

    return trainMinutes > nowMinutes;
  }).slice(0,2);
}


/* ===== 表示 ===== */
let showGuideSecondRow = false;
let currentGuideMessageUp = "";
let currentGuideMessageDown = "";
let manualDayType = null; // "weekday" | "holiday" | null

// 案内スクロールを2分ごとに1回だけ表示
let guideTimer = null;

function showGuideOnce(){

  const upTrains = getNextTrains(trainsUp);
  const downTrains = getNextTrains(trainsDown);

  const firstTrainUp = upTrains[0];
  const firstTrainDown = downTrains[0];

  currentGuideMessageUp =
    generateGuideMessageUp(firstTrainUp);

  currentGuideMessageDown =
    generateGuideMessageDown(firstTrainDown);

  showGuideSecondRow = true;

  /*
   * 案内表示を開始
   */
  updateBoard();

  /*
   * 前回のタイマーが残っていたら解除
   */
  if (guideTimer !== null) {
    clearTimeout(guideTimer);
  }

  /*
   * 15秒後に必ず通常表示へ戻す
   */
  guideTimer = setTimeout(() => {

    showGuideSecondRow = false;

    /*
     * スクロール表示を強制的に終了して
     * 通常の2列車表示を再構築する
     */
    updateBoard();

    guideTimer = null;

  }, 15000);
}


setInterval(showGuideOnce, 30000);

/* 30秒ごとの表示切替 */
let showDelayNormal = true;
setInterval(()=>{
  showDelayNormal = !showDelayNormal;
  updateBoard();
}, 30000);

/* ===== 行レンダリング ===== */
function renderRow(train){
  if(!train) return `<div class="row" style="height:50px;"></div>`;

  const delay = delays[train.no] || 0;
  const depTimeStr = train.time;

  let displayTimeHtml;
  if(delay > 0){
    displayTimeHtml = showDelayNormal
      ? `<span>${depTimeStr}</span>`
      : `<span class="delay">遅れ${delay}分</span>`;
  } else {
    displayTimeHtml = `<span>${depTimeStr}</span>`;
  }

  return `
    <div class="row">
      <div class="type ${train.type==='快速'?'rapid':''}">
        ${lang==='ja'?train.type:typeMap[train.type]}
      </div>
      <div class="dest">${lang==='ja'?train.dest:destMap[train.dest]}</div>
      <div class="time2">${displayTimeHtml}</div>
    </div>
  `;
}

function renderBlock(b){
  const firstTrain = b.trains[0];
  const secondTrain = b.trains[1];
  const arriving = firstTrain ? isArrivingSoon(firstTrain) : false;

  let html = `
  <div class="block" data-direction="${b.direction}">
    <div class="block-title">
      <div class="no">${b.noLeft}</div>
      <div style="text-align:center">${b.title}</div>
      <div class="no">${b.noRight}</div>
    </div>
    <div class="header">
      <div>種別</div><div>行先</div><div>発車時刻</div>
    </div>
    <div class="table">`;

  // 1行目
  html += renderRow(firstTrain);

  // 2行目
  if(arriving){
    html += `<div class="row arrival blink"><div>列車がまいります</div></div>`;
  } else if(showGuideSecondRow){
    const msg = b.title.includes("上り") ? currentGuideMessageUp : currentGuideMessageDown;
    if(msg && !msg.includes("ご案内です")){
      html += `<div class="row arrival scroll"><div><span>${msg}</span></div></div>`;
    } else {
      html += renderRow(secondTrain);
    }
  } else {
    html += renderRow(secondTrain);
  }

  html += `</div></div>`;
  return html;
}

/* ===== ボード更新 ===== */
function updateBoard(){

  const board = document.getElementById("board");

  if (!board) return;

  const up = {
    noLeft: "2",
    noRight: "1",
    title: "上り　取手方面",
    direction: "up",

  };

  const down = {
    noLeft: "4",
    noRight: "3",
    title: "下り　守谷・水海道・下館方面",
    direction: "down",
    trains: getNextTrains(trainsDown)
  };

  /*
   * 現在表示されている案内スクロール。
   */
  const scrolling =
    board.querySelector(".row.arrival.scroll");

  /*
   * 「列車がまいります」は常に最新状態を
   * 優先して再描画する。
   */
  const approaching =
    board.querySelector(".row.arrival.blink");

  /*
   * 案内スクロール中は、通常の1秒更新では
   * DOMを書き換えない。
   *
   * ただし showGuideSecondRow が false になった場合は
   * スクロール終了なので必ず再描画する。
   */
  if (
    scrolling &&
    showGuideSecondRow &&
    !approaching
  ) {
    return;
  }

  /*
   * 通常表示へ戻す。
   */
  board.innerHTML = window.innerWidth >= 1250
    ? `<div>${renderBlock(down)}</div><div>${renderBlock(up)}</div>`
    : `<div>${renderBlock(up)}</div><div>${renderBlock(down)}</div>`;
}




/* ===== 現在時刻 & 次列車更新 ===== */
function updateTime(){

document.getElementById("addDelay").addEventListener("click", ()=>{

function updateDateInfo(){

  const d = new Date();

  const y = d.getFullYear();
  const m = d.getMonth() + 1;

  const isWeekend = (week === 0 || week === 6);

        : "平日ダイヤ";

// 祝日判定
function isJapaneseHoliday(date){
  const y = date.getFullYear();
  const m = (date.getMonth() + 1).toString().padStart(2, "0");
  const d = date.getDate().toString().padStart(2, "0");
  const key = `${y}-${m}-${d}`;

  return holidays[y]?.includes(key) ?? false;
}

function loadTimetableByDayType(){
  let dayType;

  if(manualDayType){
    dayType = manualDayType; // 手動優先
  } else {
    const now = new Date();
    const week = now.getDay();
    const isWeekend = (week === 0 || week === 6);
    const isHoliday = isJapaneseHoliday(now);
    dayType = (isWeekend || isHoliday) ? "holiday" : "weekday";
  }

  if(currentDayType === dayType) return;
  currentDayType = dayType;

  if(dayType === "holiday"){
    trainsUp = parseCsv(csvUpHoliday);
    trainsDown = parseCsv(csvDownHoliday);
  } else {
    trainsUp = parseCsv(csvUpWeekday);
    trainsDown = parseCsv(csvDownWeekday);
  }

  updateBoard();
  updateNextTrains();
  updateTimetableStatus();
}

<script>
/* =========================================================
   音声システム 完成版
   iPad / iPhone Safari対応
   ========================================================= */


/* =========================================================
   音声ファイル
   ========================================================= */

const upSound = new Audio("./up.mp3");
const downSound = new Audio("./dw.mp3");

const upJingle = new Audio("./uj.mp3");

/* =========================================================
   音声一覧
   ========================================================= */

const audioList = [
    upSound,

    upJingle,

];

   基本設定

audioList.forEach(audio => {

     */

});


upSound.loop = true;
downSound.loop = true;
mel.loop = true;


/* =========================================================
   音声有効状態

let audioEnabled = false;


/* =========================================================
   接近状態
   ========================================================= */

let wasUpApproaching = false;
let wasDownApproaching = false;


/* =========================================================
   ジングル状態
   ========================================================= */

let upJinglePlaying = false;

/* =========================================================
   音声デバッグ
   ========================================================= */

function updateAudioDebug() {

    const debug =
        document.getElementById("audioDebug");

    if (!debug) return;


    function state(audio) {

        if (!audio) {
            return "存在しません";
        }

        if (audio.error) {

            return (
                "ERROR " +
                audio.error.code +
                " / " +
                (audio.error.message || "")
            );

        }

        if (audio.ended) {
            return "終了";
        }

        if (audio.paused) {
            return "停止中";
        }

        return "再生中";
    }


    function time(audio) {

        if (!audio) {
            return "----";
        }

        return Number.isFinite(audio.currentTime)
            ? audio.currentTime.toFixed(2)
            : "----";
    }


    function ready(audio) {

        if (!audio) {
            return "----";
        }

        return audio.readyState;
    }


    debug.textContent =
`===== 音声デバッグ =====

音声有効:
${audioEnabled ? "YES" : "NO"}

--------------------------------

up.mp3
状態: ${state(upSound)}
時間: ${time(upSound)}
readyState: ${ready(upSound)}

dw.mp3
状態: ${state(downSound)}
時間: ${time(downSound)}
readyState: ${ready(downSound)}

uj.mp3
状態: ${state(upJingle)}
時間: ${time(upJingle)}
readyState: ${ready(upJingle)}

dj.mp3
状態: ${state(downJingle)}
時間: ${time(downJingle)}
readyState: ${ready(downJingle)}

mel.mp3
状態: ${state(mel)}

readyState: ${ready(mel)}

cls.mp3

readyState: ${ready(cls)}

--------------------------------

上り接近:
${wasUpApproaching ? "YES" : "NO"}

下り接近:
${wasDownApproaching ? "YES" : "NO"}

上りジングル:
${upJinglePlaying ? "PLAYING" : "STOP"}

下りジングル:
${downJinglePlaying ? "PLAYING" : "STOP"}
`;
}


/* =========================================================
   音声エラー監視

audioList.forEach(audio => {

    audio.addEventListener("error", () => {

        console.error(

        updateAudioDebug();

    audio.addEventListener("loadeddata", () => {

        );

        updateAudioDebug();

    });

});


/* =========================================================
   安全な停止
   ========================================================= */

function safeStop(audio) {

    if (!audio) return;

    try {

        audio.pause();

        /*
         * currentTimeを戻す
         */
        audio.currentTime = 0;

    } catch (error) {

        console.warn(
            "[音声停止エラー]",
            error
        );

    }
}


/* =========================================================
   安全な再生
   ========================================================= */

async function safePlay(audio, name) {

    if (!audioEnabled) {

        console.warn(
            `${name}: 音声が有効化されていません`
        );

        updateAudioDebug();

        return false;
    }


    if (!audio) {

        console.error(
            `${name}: Audioオブジェクトがありません`
        );

        return false;
    }


    try {

        console.log(
            `[音声再生開始] ${name}`
        );


        await audio.play();


        console.log(
            `[音声再生成功] ${name}`
        );


        updateAudioDebug();

        return true;


    } catch (error) {

        console.error(
            `[音声再生失敗] ${name}`,
            error
        );


        updateAudioDebug();

        return false;
    }
}


/* =========================================================
   音声有効化
   ========================================================= */

async function enableAudio() {

    if (audioEnabled) {

        updateAudioDebug();

        return true;
    }


    console.log(
        "[音声] ユーザー操作による音声有効化開始"
    );


    let successCount = 0;


    /*
     * ユーザー操作中に全音声を一度再生する。
     *
     * iPad Safariでは、最初のplay()をユーザー操作から
     * 行っておくことが重要。
     */

    for (const audio of audioList) {

        try {

            audio.currentTime = 0;

            await audio.play();

            audio.pause();

            audio.currentTime = 0;

            successCount++;

        } catch (error) {

            console.warn(
                "[音声初期化失敗]",
                audio.src,
                error
            );

        }
    }


    /*
     * 少なくとも1つの音声が再生できれば有効化
     */
    if (successCount > 0) {

        audioEnabled = true;

    } else {

        audioEnabled = false;

    }


    const button =
        document.getElementById(
            "enableAudioButton"
        );


    const status =
        document.getElementById(
            "audioStatus"
        );


    if (audioEnabled) {

        if (button) {

            button.textContent =
                "🔊 音声有効";

            button.style.background =
                "#267a35";

        }


        if (status) {

            status.textContent =
                "音声は有効です。接近放送などが自動再生されます。";

            status.style.color =
                "#267a35";

        }

        console.log(
            "[音声] 有効化成功",
            successCount + "/" + audioList.length
        );

    } else {

        if (button) {

            button.textContent =
                "🔊 音声を有効にする";

            button.style.background =
                "#222";

        }


        if (status) {

            status.textContent =
                "音声を有効化できませんでした。もう一度タップしてください。";

            status.style.color =
                "#cc0000";

        }

    }


    updateAudioDebug();

    return audioEnabled;
}


/* =========================================================
   音声有効化ボタン
   ========================================================= */

const enableAudioButton =
    document.getElementById(
        "enableAudioButton"
    );


if (enableAudioButton) {

    enableAudioButton.addEventListener(
        "click",
        async () => {

            await enableAudio();

        }
    );

}


/* =========================================================
   ジングル再生
   ========================================================= */

async function playJingle(
    audio,
    name,
    type
) {

    if (!audioEnabled) {

        console.warn(
            `${name}: 音声無効`
        );

        return false;
    }


    /*
     * 二重再生防止
     */

    if (
        type === "up" &&
        upJinglePlaying
    ) {

        console.log(
            `${name}: すでに再生中`
        );

        return false;
    }


    if (
        type === "down" &&
        downJinglePlaying
    ) {

        console.log(
            `${name}: すでに再生中`
        );

        return false;
    }


    /*
     * 再生中フラグを先にON
     */
    if (type === "up") {

        upJinglePlaying = true;

    } else {

        downJinglePlaying = true;

    }


    /*
     * 古いイベントを削除
     */
    audio.onended = null;


    /*
     * 再生終了イベント
     */
    audio.onended = () => {

        console.log(
            `[ジングル終了] ${name}`
        );


        if (type === "up") {

            upJinglePlaying = false;

        } else {

            downJinglePlaying = false;

        }


        updateAudioDebug();

    };


    try {

        /*
         * 最初から再生
         */
        audio.pause();

        audio.currentTime = 0;


        console.log(
            `[ジングル再生開始] ${name}`
        );


        await audio.play();


        console.log(
            `[ジングル再生成功] ${name}`

        updateAudioDebug();

        return true;

        console.error(
            `[ジングル再生失敗] ${name}`,

        );


        /*
         * 再生失敗時
         */
        if (type === "up") {

            upJinglePlaying = false;

        } else {

            downJinglePlaying = false;

        }


        updateAudioDebug();

        return false;

/* =========================================================
   上り接近放送
   ========================================================= */

async function handleUpApproach(
    upApproaching
) {

    console.log(
        `[上り接近判定] ${wasUpApproaching} → ${upApproaching}`
    );


    /* =========================================
       接近開始
       ========================================= */

    if (
        upApproaching &&
        !wasUpApproaching
    ) {

        console.log(
            "上り：列車がまいります 開始"
        );


        /*
         * ジングル停止
         */
        safeStop(upJingle);

        upJinglePlaying = false;


        /*
         * 接近放送開始
         */
        if (audioEnabled) {

            safeStop(upSound);

            await safePlay(
                upSound,
                "up.mp3"
            );

        }

    }


    /* =========================================
       接近中
       ========================================= */

    if (upApproaching) {

        if (
            audioEnabled &&
            upSound.paused
        ) {

            await safePlay(
                upSound,
                "up.mp3"
            );

        }

    }


    /* =========================================
       接近終了
       ========================================= */

    if (
        !upApproaching &&
        wasUpApproaching
    ) {

        console.log(
            "上り：列車がまいります 終了"
        );


        /*
         * 接近放送停止
         */
        safeStop(upSound);


        /*
         * ジングル
         */
        await playJingle(
            upJingle,
            "uj.mp3",
            "up"
        );

    }


    /*
     * 状態保存
     */
    wasUpApproaching =
        upApproaching;
}


/* =========================================================
   下り接近放送
   ========================================================= */

async function handleDownApproach(
    downApproaching
) {

    console.log(
        `[下り接近判定] ${wasDownApproaching} → ${downApproaching}`
    );


    /* =========================================
       接近開始
       ========================================= */

    if (
        downApproaching &&
        !wasDownApproaching
    ) {

        console.log(
            "下り：列車がまいります 開始"
        );


        /*
         * ジングル停止
         */
        safeStop(downJingle);

        downJinglePlaying = false;


        /*
         * 接近放送開始
         */
        if (audioEnabled) {

            safeStop(downSound);

            await safePlay(
                downSound,
                "dw.mp3"
            );

        }

    }


    /* =========================================
       接近中
       ========================================= */

    if (downApproaching) {

        if (
            audioEnabled &&
            downSound.paused
        ) {

            await safePlay(
                downSound,
                "dw.mp3"
            );

        }

    }


    /* =========================================
       接近終了
       ========================================= */

    if (
        !downApproaching &&
        wasDownApproaching
    ) {

        console.log(
            "下り：列車がまいります 終了"
        );


        /*
         * 接近放送停止
         */
        safeStop(downSound);


        /*
         * 下りジングル
         */
        await playJingle(
            downJingle,
            "dj.mp3",
            "down"
        );

    }


    /*
     * 状態保存
     */
    wasDownApproaching =
        downApproaching;
}


/* =========================================================
   接近状態を時刻から判定
   ========================================================= */

function checkApproachState() {

    /*
     * 画面DOMではなく、
     * 実際の時刻表データから判定する。
     *
     * これによりupdateBoard()との競合を防ぐ。
     */


    const upTrains =
        getNextTrains(trainsUp);


    const downTrains =
        getNextTrains(trainsDown);


    const firstUp =
        upTrains[0];


    const firstDown =
        downTrains[0];


    const upApproaching =
        firstUp
            ? isArrivingSoon(firstUp)
            : false;


    const downApproaching =
        firstDown
            ? isArrivingSoon(firstDown)
            : false;


    return {
        upApproaching,
        downApproaching
    };
}


/* =========================================================
   音声メイン処理
   ========================================================= */

let audioCheckRunning = false;


async function updateApproachSound() {

    /*
     * 前回の処理がまだ終わっていたら
     * 二重実行しない。
     */

    if (audioCheckRunning) {

        return;

    }


    audioCheckRunning = true;


    try {

        const state =
            checkApproachState();


        await handleUpApproach(
            state.upApproaching
        );


        await handleDownApproach(
            state.downApproaching
        );


        updateAudioDebug();

    } catch (error) {

        console.error(
            "[音声メイン処理エラー]",
            error
        );

    }


    audioCheckRunning = false;
}


/* =========================================================
   音声監視
   ========================================================= */

setInterval(
    updateApproachSound,
    500
);


/* =========================================================
   デバッグ更新
   ========================================================= */

setInterval(
    updateAudioDebug,
    500
);


/* =========================================================
   スイッチ操作
   ========================================================= */

(() => {

    const switches =
        document.querySelectorAll(
            ".switch"
        );


    switches.forEach(
        switchElement => {

            const onButton =
                switchElement.querySelector(
                    ".on-button"
                );


            const offButton =
                switchElement.querySelector(
                    ".off-button"
                );


            const status =
                switchElement.querySelector(
                    ".status"
                );


            /* =========================================
               ON
               ========================================= */

            onButton.addEventListener(
                "click",
                async () => {

                    /*
                     * ユーザー操作を利用して
                     * 音声を有効化
                     */

                    if (!audioEnabled) {

                        await enableAudio();

                    }


                    /*
                     * すでにONなら終了
                     */

                    if (
                        onButton.classList.contains(
                            "pressed"
                        )
                    ) {

                        return;

                    }


                    /*
                     * ON状態
                     */

                    onButton.classList.add(
                        "pressed"
                    );


                    switchElement.classList.add(
                        "is-on"
                    );


                    status.textContent =
                        "ON";


                    /*
                     * OFF音停止
                     */

                    safeStop(cls);


                    /*
                     * ON音再生
                     */

                    safeStop(mel);


                    await safePlay(
                        mel,
                        "mel.mp3"
                    );

                }
            );


            /* =========================================
               OFF
               ========================================= */

            offButton.addEventListener(
                "click",
                async () => {

                    const wasOn =
                        onButton.classList.contains(
                            "pressed"
                        );


                    /*
                     * ON音停止
                     */

                    if (wasOn) {

                        safeStop(mel);

                    }


                    /*
                     * OFF状態
                     */

                    onButton.classList.remove(
                        "pressed"
                    );


                    switchElement.classList.remove(
                        "is-on"
                    );


                    status.textContent =
                        "OFF";


                    /*
                     * ON → OFFのときだけ
                     * OFF音を再生
                     */

                    if (wasOn) {

                        safeStop(cls);


                        await safePlay(
                            cls,
                            "cls.mp3"
                        );

                    }

                }
            );

        }
    );

})();
</script>
