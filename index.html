<html lang="ja">
<head>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: "JFドットjiskan24h", "MS ゴシック", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* 現在時刻 */
.top {
  width: 1200px;
  display: grid;
  grid-template-columns: 80px 580px 1fr 200px;
  align-items: start;
  padding: 18px 0 5px;
  font-family: "MS ゴシック";
  box-sizing: border-box;
  margin: 0 auto;
}
.top .label { font-size:16px; font-weight:bold; }
.top .time  { font-size:48px; font-weight:bold; text-align:left;}

/* 発車標 */
.board {
  display: grid;
  grid-template-columns: 625px;
  justify-content: center;
}
.board > div {
  width: 625px;
  background: #777;
  margin: 8px 0;
}
@media screen and (min-width: 1250px) {
  .board { grid-template-columns: 625px 625px; }
}

/* ブロック */
.block {
  background: #666;
  margin: 0;
  padding: 6px;
}

/* タイトル */
.block-title {
  display: grid;
  grid-template-columns: 70px 1fr 40px;
  align-items: center;
  color: #fff;
  font-size: 26px;
  font-family: "国鉄っぽいフォント（正体）";
  margin-bottom: 4px;
}

.block-title .no {
  border:3px solid #fff;
  width:35px;
  text-align:center;
}

/* 見出し */
.header {
  display: grid;
  grid-template-columns: 130px 240px 120px;
  font-size: 18px;
  font-family: "MS ゴシック";
  color: #fff;
  text-align: center;
  margin-bottom: 2px;
}

/* 表 */
.table {
  background: #3a3a3a;
  padding: 4px 0;
}
.row {
  display: grid;
  grid-template-columns: 130px 240px 118px;
  align-items: center;
  margin-bottom: 2px;
  height: 50px;
  }

/* 文字 */
.type  { color: #33cc33; font-size:46px; text-align:center; }
.dest  { color: #ffcc00; font-size:46px; text-align:center; }
.time2 { color: #33cc33; font-size:46px; text-align:right; position: relative;}
.cars  { color: #ffcc00; font-size:46px; text-align:center; }
.track { color: #33cc33; font-size:46px; text-align:center; }

.cars .suffix {
  font-size: 24px;
  position: relative;
  top: -2px;
  margin-left: 2px;
}

/* ===== 案内表示 ===== */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes scrollText {
  0%   { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}


/* 案内行（row互換） */
.row.arrival {
  grid-template-columns: 1fr;
  height: 50px;
}

.service-info iframe {
  width: 650px;
  height: 170px;
}
.row.arrival > div {
  grid-column: 1 / -1;
  width: 100%;
  font-size: 48px;
  text-align: center;
  color: #ff3333; /* 赤 */
  overflow: hidden;
  white-space: nowrap;
}


.row.arrival.scroll {
  position: relative;
  overflow: hidden;
}

.row.arrival.scroll span {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: scrollText 12s linear forwards;
  will-change: transform;
}


/* 点滅 */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}

.row.arrival.blink > div {
  animation: blink 1s steps(1) infinite;
}

.type.rapid {
  color: #ff3333; /* 赤 */
}


.next-trains {
  font-size: 24px;
  color: #333;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.time2 .delay {
  position: absolute;
  bottom: -20px;       /* 時刻の真ん中下寄り */
  left: 50%;
  transform: translateX(-50%);
  color: red;
  font-size: 23px;   /* 元の半分 */
 white-space: nowrap;
}

.station-sign {
  width: 400px;
  height: 120px;
  background: #fff;
  border: 4px solid #000;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: "国鉄っぽいフォント（正体）", "MS ゴシック", monospace;
}

.sign-main {
  font-size: 50px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.sign-sub {
  font-size: 42px;
  padding: 2px 24px;
  border-top: 2px solid #000;
}
.next-trains{
  font-size: 38px;
  margin-bottom: 6px;
  font-family: "国鉄っぽいフォント（正体）", "MS ゴシック", monospace;

}

   音声スイッチ

/* ========================================
   スイッチ操作
======================================== */

.switch-page {
    width: 100%;
    padding: 50px 20px 80px;

    text-align: center;

    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    color: #333;
}

.switch-title {
    margin-bottom: 45px;

    font-size: 26px;
    font-weight: 600;

    letter-spacing: 0.12em;
}

.switch-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;

    gap: 55px;

    flex-wrap: wrap;
}
.switch {
    position: relative;

    width: 365px;
    height: 544px;

    transform: none;
    transition: none;
}

.switch:hover {
    transform: none;
}

.switch-image {
    display: block;

    width: 365px;
    height: 544px;

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: none;
}

/* ========================================
   ONボタン
======================================== */

.on-button {
    position: absolute;

    left: 150px;
    top: 225px;

    width: 71px;
    height: 71px;

    padding: 0;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    background: #050505;
    color: #eeeeee;

    font-family: Arial, sans-serif;
    font-size: 33px;
    font-weight: 300;

    display: flex;
    justify-content: center;
    align-items: center;

    transform: translateY(0);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        inset 0 -3px 4px rgba(0,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.8);

    transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;

    user-select: none;
}


/*
 * ON中は押し込まれた状態を維持
 */

.on-button.pressed {
    transform:
        translateY(2px)
        scale(0.96);

    box-shadow:
        inset 0 4px 6px rgba(0,0,0,0.9),
        inset 0 -1px 2px rgba(255,255,255,0.08),
        0 0 1px rgba(0,0,0,0.8);
}


/* ========================================
   OFFボタン
======================================== */

.off-button {
    position: absolute;

    left: 150px;
    top: 323px;

    width: 71px;
    height: 71px;

    padding: 0;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    background: #d40000;
    color: white;

    font-family: Arial, sans-serif;
    font-size: 31px;
    font-weight: 300;

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        inset 0 -3px 4px rgba(100,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.8);

    transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;

    user-select: none;
}


/*
 * OFFは押した瞬間だけ沈む
 */

.off-button:active {
    transform:
        translateY(-2px)
        scale(0.96);

    box-shadow:
        inset 0 4px 6px rgba(80,0,0,0.9),
        inset 0 -1px 2px rgba(255,255,255,0.08);
}


/* ========================================
   状態表示
======================================== */

.status {
    position: absolute;

    bottom: -42px;

    left: 50%;

    transform: translateX(-50%);

    min-width: 90px;

    padding: 6px 16px;

    text-align: center;

    border-radius: 15px;

    background: #eeeeee;

    color: #777;

    font-size: 13px;

    letter-spacing: 0.08em;

    border: 1px solid #dddddd;
}

.switch.is-on .status {
    color: #267a35;
    background: #eef8ef;
    border-color: #c8e5cc;
}


/* ========================================
   スマホ対応
======================================== */

@media (max-width: 1000px) {

    .switch-container {
        gap: 70px;
    }

}

@media (max-width: 520px) {

    .switch-page {
        padding: 30px 10px;
    }

    .switch-title {
        font-size: 22px;
        margin-bottom: 35px;
    }

    .switch {
        transform: scale(0.78);
        transform-origin: center top;

        margin-bottom: -130px;
    }

    .switch:hover {
        transform: scale(0.78);
    }

}

/* =========================================================
   iPad 横向き
   ========================================================= */

@media screen and
(min-width: 768px) and
(max-width: 1366px) and
(orientation: landscape) {

    .top {
        width: calc(100vw - 32px);
    }

    .board {
        width: 100%;
        max-width: 1280px;

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr);

        gap: 10px;

        padding: 0 10px;
    }

    .board > div {
        width: 100%;
        max-width: none;
        min-width: 0;
    }

    .header {
        grid-template-columns:
            22%
            40%
            38%;
    }

    .row {
        grid-template-columns:
            22%
            40%
            38%;
    }

    .type,
    .dest,
    .time2 {
        font-size: clamp(27px, 3.8vw, 42px);
    }

    .block-title {
        font-size: clamp(20px, 2.5vw, 26px);
    }

    .switch-container {
        flex-direction: row;
        flex-wrap: nowrap;

        gap: 20px;

        justify-content: center;
    }

    .switch {
        transform: scale(
            min(
                0.85,
                calc((100vw - 80px) / 760)
            )
        );

        transform-origin: top center;

        margin-bottom: -80px;
    }

    .switch:hover {
        transform: scale(
            min(
                0.85,
                calc((100vw - 80px) / 760)
            )
        );
    }
}

   iPad 縦向き

    date.getMonth() + 1
  ).padStart(2, "0");

  const d = String(
    date.getDate()
  ).padStart(2, "0");

  const key = `${y}-${m}-${d}`;

  return holidays[y]?.includes(key) ?? false;
}


function getAutomaticDayType(date = new Date()) {

  const day = date.getDay();

  const weekend =
    day === 0 ||
    day === 6;

  const holiday =
    isJapaneseHoliday(date);

  return (
    weekend ||
    holiday
  )
    ? "holiday"
    : "weekday";
}


/* =========================================================
   6. CSV
   ========================================================= */

function parseCsv(csv) {

  return csv
    .trim()
    .split("\n")
    .map(line => {

      const c = line.split(",");

      return {
        no: c[0],
        dest: c[1],
        track: c[2],
        time: c[3],
        type: c[4],
        trackno: c[5],
        cars: c[6],
        arrivalMin: Number(c[7] || 1)
      };

    });
}


/* =========================================================
   7. 時刻表管理
   ========================================================= */

function loadTimetable() {

  const dayType =
    AppState.manualDayType ||
    getAutomaticDayType();

  /*
   * 同じダイヤなら何もしない
   */

  if (
    AppState.dayType === dayType &&
    AppState.trainsUp.length > 0
  ) {
    updateTimetableStatus();
    return;
  }

  AppState.dayType = dayType;

  if (dayType === "holiday") {

    AppState.trainsUp =
      parseCsv(csvUpHoliday);

    AppState.trainsDown =
      parseCsv(csvDownHoliday);

  } else {

    AppState.trainsUp =
      parseCsv(csvUpWeekday);

    AppState.trainsDown =
      parseCsv(csvDownWeekday);
  }

  updateTimetableStatus();

  refreshBoard();
}


/* =========================================================
   8. 列車時刻計算
   ========================================================= */

function getRemainingTime(train) {

  if (!train) {
    return Infinity;
  }

  const now = new Date();

  const [
    hour,
    minute
  ] = train.time
    .split(":")
    .map(Number);

  let departure =
    new Date(now);

  departure.setHours(
    hour,
    minute,
    0,
    0
  );

  /*
   * 遅延
   */

  const delay =
    AppState.delays[train.no] || 0;

  departure.setMinutes(
    departure.getMinutes() + delay
  );

  /*
   * 4時基準の日付補正
   */

  const nowHour =
    now.getHours();

  if (
    hour < 4 &&
    nowHour >= 4
  ) {

    departure.setDate(
      departure.getDate() + 1
    );

  } else if (
    hour >= 4 &&
    nowHour < 4
  ) {

    departure.setDate(
      departure.getDate() - 1
    );
  }

  return (
    departure - now
  ) / 1000;
}


function getNextTrains(trains) {

  const now =
    new Date();

  const nowMinutes =
    now.getHours() * 60 +
    now.getMinutes();

  return trains
    .filter(train => {

      const [
        hour,
        minute
      ] = train.time
        .split(":")
        .map(Number);

      const delay =
        AppState.delays[train.no] || 0;

      let trainMinutes =
        hour * 60 +
        minute +
        delay;

      if (
        hour < 4 &&
        now.getHours() >= 4
      ) {

        trainMinutes += 24 * 60;
      }

      return trainMinutes > nowMinutes;

    })
    .slice(0, 2);
}


function isArrivingSoon(train) {

  if (!train) {
    return false;
  }

  const remaining =
    getRemainingTime(train);

  const beforeSec =
    (train.arrivalMin || 1) * 60;

  return (
    remaining <= beforeSec &&
    remaining > beforeSec - 60
  );
}


/* =========================================================
   9. 案内文
   ========================================================= */

function generateGuideMessageUp(train) {

  if (!train) {
    return "";
  }

  const dest =
    normalizeDest(train.dest);

  if (train.track === "乗") {
    return `こんどの${dest}行きは水海道にて乗り換えとなります。`;
  }

  if (train.track === "始") {
    return `こんどの${dest}行きは当駅始発の列車です。`;
  }

  if (train.track === "接") {
    return `こんどの${dest}行きは水海道にて快速に接続いたします。`;
  }

  if (train.cars === "1") {
    return `こんどの${dest}行きは1両編成でまいります。`;
  }

  if (train.type === "快速") {
    return "終点取手まで各駅に停車いたします。";
  }

  return `こんどの${dest}行のご案内です`;
}


function generateGuideMessageDown(train) {

  if (!train) {
    return "";
  }

  const dest =
    normalizeDest(train.dest);

  if (train.track === "乗") {
    return `こんどの${dest}行きは水海道にて乗り換えとなります。`;
  }

  if (train.track === "始") {
    return `こんどの${dest}行きは当駅始発の列車です。`;
  }

  if (train.track === "接") {
    return `こんどの${dest}行きは水海道にて快速に接続いたします。`;
  }

  if (train.track === "快") {
    return `こんどの${dest}行きは守谷にて快速に接続いたします。`;
  }

  if (train.cars === "1") {
    return `こんどの${dest}行きは1両編成でまいります。`;
  }

  if (train.type === "快速") {
    return `こんどの${dest}行きは快速列車です。停車駅にご注意ください。`;
  }

  return `こんどの${dest}行のご案内です`;
}


/* =========================================================
   10. 行描画
   ========================================================= */

function renderRow(train) {

  if (!train) {

    return `
      <div class="row" style="height:50px;"></div>
    `;
  }

  const delay =
    AppState.delays[train.no] || 0;

  let timeHtml;

  if (delay > 0) {

    timeHtml =
      AppState.showDelayNormal

        ? `<span>${train.time}</span>`

        : `<span class="delay">
             遅れ${delay}分
           </span>`;

  } else {

    timeHtml =
      `<span>${train.time}</span>`;
  }

  const type =
    AppState.lang === "ja"
      ? train.type
      : typeMap[train.type];

  const dest =
    AppState.lang === "ja"
      ? train.dest
      : destMap[train.dest];

  return `
    <div class="row">

      <div class="type ${train.type === "快速" ? "rapid" : ""}">
        ${type}
      </div>

      <div class="dest">
        ${dest}
      </div>

      <div class="time2">
        ${timeHtml}
      </div>

    </div>
  `;
}


/* =========================================================
   11. ブロック描画
   ========================================================= */

function renderBlock(block) {

  const firstTrain =
    block.trains[0];

  const secondTrain =
    block.trains[1];

  const arriving =
    isArrivingSoon(firstTrain);

  let html = `

    <div
      class="block"
      data-direction="${block.direction}"
    >

      <div class="block-title">

        <div class="no">
          ${block.noLeft}
        </div>

        <div style="text-align:center">
          ${block.title}
        </div>

        <div class="no">
          ${block.noRight}
        </div>

      </div>

      <div class="header">
        <div>種別</div>
        <div>行先</div>
        <div>発車時刻</div>
      </div>

      <div class="table">
  `;


  /*
   * 1列車目
   */

  html +=
    renderRow(firstTrain);


  /*
   * 2列車目
   */

  if (arriving) {

    html += `
      <div class="row arrival blink">
        <div>列車がまいります</div>
      </div>
    `;

  } else if (AppState.showGuide) {

    const message =
      block.direction === "up"
        ? AppState.guideMessageUp
        : AppState.guideMessageDown;

    if (
      message &&
      !message.includes("ご案内です")
    ) {

      html += `
        <div class="row arrival scroll">
          <div>
            <span>${message}</span>
          </div>
        </div>
      `;

    } else {

      html +=
        renderRow(secondTrain);
    }

  } else {

    html +=
      renderRow(secondTrain);
  }


  html += `
      </div>
    </div>
  `;

  return html;
}


/* =========================================================
   12. ボード描画
   ========================================================= */

function refreshBoard() {

  if (!DOM.board) {
    return;
  }

  /*
   * 案内スクロール中は
   * 不要なDOM再構築をしない
   */

  const scrolling =
    DOM.board.querySelector(
      ".row.arrival.scroll"
    );

  const approaching =
    DOM.board.querySelector(
      ".row.arrival.blink"
    );

  if (
    scrolling &&
    AppState.showGuide &&
    !approaching
  ) {
    return;
  }


  const up = {

    noLeft: "",
    noRight: "",

    title:
      "上り　取手方面",

    direction:
      "up",

    trains:
      getNextTrains(
        AppState.trainsUp
      )
  };


  const down = {

    noLeft: "",
    noRight: "",

    title:
      "下り　守谷・水海道・下館方面",

    direction:
      "down",

    trains:
      getNextTrains(
        AppState.trainsDown
      )
  };


  const wide =
    window.innerWidth >= 1250;


  if (wide) {

    DOM.board.innerHTML = `
      <div>
        ${renderBlock(down)}
      </div>

      <div>
        ${renderBlock(up)}
      </div>
    `;

  } else {

    DOM.board.innerHTML = `
      <div>
        ${renderBlock(up)}
      </div>

      <div>
        ${renderBlock(down)}
      </div>
    `;
  }
}


/* =========================================================
   13. 案内表示
   ========================================================= */

function startGuideDisplay() {

  const up =
    getNextTrains(
      AppState.trainsUp
    );

  const down =
    getNextTrains(
      AppState.trainsDown
    );


  AppState.guideMessageUp =
    generateGuideMessageUp(up[0]);


  AppState.guideMessageDown =
    generateGuideMessageDown(down[0]);


  AppState.showGuide =
    true;


  refreshBoard();


  if (
    AppState.guideTimer !== null
  ) {

    clearTimeout(
      AppState.guideTimer
    );
  }


  AppState.guideTimer =
    setTimeout(() => {

      AppState.showGuide =
        false;

      refreshBoard();

      AppState.guideTimer =
        null;

    }, 15000);
}


/* =========================================================
   14. 時計
   ========================================================= */

function updateClock() {

  if (!DOM.now) {
    return;
  }

  const now =
    new Date();

  DOM.now.textContent =
    `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
}


/* =========================================================
   15. 遅延
   ========================================================= */

function addDelay() {

  if (
    !DOM.delayTrainNo ||
    !DOM.delayMinutes
  ) {
    return;
  }

  const trainNo =
    DOM.delayTrainNo.value.trim();

  const minutes =
    parseInt(
      DOM.delayMinutes.value,
      10
    );


  if (
    !trainNo ||
    Number.isNaN(minutes)
  ) {

    alert(
      "列車番号と遅延時間を正しく入力してください"
    );

    return;
  }


  AppState.delays[trainNo] =
    minutes;


  alert(
    `${trainNo}列車に${minutes}分の遅延を設定しました`
  );


  const scrolling =
    DOM.board?.querySelector(
      ".row.arrival.scroll"
    );


  if (!scrolling) {

    refreshBoard();
  }
}


/* =========================================================
   16. 言語切替
   ========================================================= */

function toggleLanguage() {

  AppState.lang =
    AppState.lang === "ja"
      ? "en"
      : "ja";

  refreshBoard();
}


/* =========================================================
   17. 遅延表示切替
   ========================================================= */

function toggleDelayDisplay() {

  AppState.showDelayNormal =
    !AppState.showDelayNormal;

  refreshBoard();
}


/* =========================================================
   18. ダイヤボタン
   ========================================================= */

function setManualDayType(type) {

  AppState.manualDayType =
    type;

  /*
   * 同じ種別でも
   * 強制再読み込みできるようにする
   */

  AppState.dayType =
    null;

  loadTimetable();

  updateTimetableStatus();
}


function setAutomaticDayType() {

  AppState.manualDayType =
    null;

  AppState.dayType =
    null;

  loadTimetable();

  updateTimetableStatus();
}


function updateTimetableStatus() {

  if (!DOM.timetableStatus) {
    return;
  }

  if (
    AppState.manualDayType ===
    "weekday"
  ) {

    DOM.timetableStatus.textContent =
      "【平日ダイヤ 手動指定】";

  } else if (
    AppState.manualDayType ===
    "holiday"
  ) {

    DOM.timetableStatus.textContent =
      "【休日ダイヤ 手動指定】";

  } else {

    DOM.timetableStatus.textContent =
      "【自動切替中】";
  }
}


/* =========================================================
   19. イベント
   ========================================================= */

function setupMainEvents() {

  if (DOM.addDelay) {

    DOM.addDelay.addEventListener(
      "click",
      addDelay
    );
  }


  if (DOM.btnAuto) {

    DOM.btnAuto.addEventListener(
      "click",
      setAutomaticDayType
    );
  }


  if (DOM.btnWeekday) {

    DOM.btnWeekday.addEventListener(
      "click",
      () => {
        setManualDayType("weekday");
      }
    );
  }


  if (DOM.btnHoliday) {

    DOM.btnHoliday.addEventListener(
      "click",
      () => {
        setManualDayType("holiday");
      }
    );
  }


  window.addEventListener(
    "resize",
    refreshBoard
  );
}


/* =========================================================
   20. メインタイマー
   ========================================================= */

/*
 * 時計
 */
setInterval(
  updateClock,
  1000
);


/*
 * ダイヤ自動切替確認
 */
setInterval(
  loadTimetable,
  60 * 1000
);


/*
 * 案内表示
 */
setInterval(
  startGuideDisplay,
  30 * 1000
);


/*
 * 日本語 / 英語切替
 */
setInterval(
  toggleLanguage,
  15 * 1000
);


/*
 * 遅延表示切替
 */
setInterval(
  toggleDelayDisplay,
  30 * 1000
);


/* =========================================================
   21. 初期化
   ========================================================= */

function initializeMainSystem() {

  setupMainEvents();

  loadTimetable();

  updateClock();

  updateTimetableStatus();

  refreshBoard();
}


initializeMainSystem();

</script>
